name: Test Pipeline
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to test (english/hindi)'
        required: true
        default: 'english'
        type: choice
        options:
          - english
          - hindi
      stage:
        description: 'Pipeline stage to test'
        required: true
        default: 'scrape'
        type: choice
        options:
          - scrape
          - script
          - audio
          - video
          - thumbnail
          - full
      dry_run:
        description: 'Dry run (no upload)'
        required: true
        default: true
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run pipeline stage
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_EN_REFRESH_TOKEN: ${{ secrets.YT_EN_REFRESH_TOKEN }}
          YT_HI_REFRESH_TOKEN: ${{ secrets.YT_HI_REFRESH_TOKEN }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python -m src.pipeline --channel ${{ inputs.channel }} --stage ${{ inputs.stage }} ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ inputs.channel }}-${{ inputs.stage }}
          path: output/
          retention-days: 7
