name: 🧪 Diagnostics & Stage Tester

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to test'
        required: true
        default: 'english'
        type: choice
        options:
          - english
          - hindi
      stage:
        description: 'Pipeline stage to test'
        required: true
        default: 'scrape'
        type: choice
        options:
          - scrape
          - script
          - audio
          - video
          - thumbnail
          - full
      dry_run:
        description: 'Dry run (no upload)'
        required: true
        default: true
        type: boolean

jobs:
  test:
    name: 🧪 Test [${{ inputs.channel }} - ${{ inputs.stage }}]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🎬 Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run pipeline stage
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_EN_REFRESH_TOKEN: ${{ secrets.YT_EN_REFRESH_TOKEN }}
          YT_HI_REFRESH_TOKEN: ${{ secrets.YT_HI_REFRESH_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python -m src.pipeline --channel "${{ inputs.channel }}" --stage "${{ inputs.stage }}" $DRY_FLAG

      - name: 📦 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-output-${{ inputs.channel }}-${{ inputs.stage }}
          path: |
            output/
            assets/
          retention-days: 7

      - name: 📊 Generate Stage Summary
        if: always()
        run: |
          echo "## 🧪 Stage Diagnostic Report" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Channel** | `${{ inputs.channel }}` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tested Stage** | `${{ inputs.stage }}` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dry Run** | `${{ inputs.dry_run }}` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ Executed successfully |" >> $GITHUB_STEP_SUMMARY
