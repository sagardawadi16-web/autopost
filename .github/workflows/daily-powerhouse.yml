name: 24/7 Triple-Format Daily Powerhouse Engine

on:
  schedule:
    - cron: '30 12 * * *'  # 6:15 PM Nepal Time / 12:30 PM UTC daily
  workflow_dispatch:
    inputs:
      stream:
        description: 'Stream filter (all, ghibli, hindi, english)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - ghibli
          - hindi
          - english
      privacy:
        description: 'YouTube visibility'
        required: false
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private
      dry_run:
        description: 'Dry run (render previews without uploading)'
        required: false
        default: false
        type: boolean

jobs:
  run-daily-powerhouse:
    name: 🚀 Produce & Publish 3 Daily Powerhouse Streams
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🎬 Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Autonomous Daily Powerhouse Batch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_GHIBLI_REFRESH_TOKEN: ${{ secrets.YT_GHIBLI_REFRESH_TOKEN }}
          YT_EN_REFRESH_TOKEN: ${{ secrets.YT_EN_REFRESH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_PRIVACY_STATUS: ${{ inputs.privacy || 'public' }}
        run: |
          STREAM="${{ inputs.stream || 'all' }}"
          DRY_RUN="${{ inputs.dry_run }}"

          FLAGS="--stream $STREAM --target-channel ghibli"
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi

          python -m src.daily_powerhouse_runner $FLAGS

      - name: 🔄 Commit Updated Learning Memory & Telemetry
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Daily Powerhouse]"
          git add data/learning_memory.json data/upload_log.json data/daily_reports/ || true
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(telemetry): update learning memory & upload log [skip ci]"
          git push || true

      - name: 📦 Archive Generated Media & Batch Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: powerhouse-daily-artifacts
          path: |
            output/ghibli/*_final.mp4
            output/video/final_*.mp4
            output/thumbnails/*.jpg
            data/daily_reports/*.json
          retention-days: 14
