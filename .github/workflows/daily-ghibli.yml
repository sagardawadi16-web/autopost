name: Daily Ghibli Studio Auto-Pilot

on:
  # schedule:
  #   - cron: '30 12 * * *'  # 6:15 PM Nepal Time daily
  workflow_dispatch:
    inputs:
      format:
        description: 'Video format (shorts or story)'
        required: false
        default: 'shorts'
        type: choice
        options:
          - shorts
          - story
      privacy:
        description: 'YouTube visibility'
        required: false
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private
      theme:
        description: 'Custom nostalgic theme prompt (optional)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (preview & download artifacts only, no upload)'
        required: false
        default: false
        type: boolean

jobs:
  auto-generate-and-publish:
    name: 🎨 Produce Daily Ghibli Nostalgia Video
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🎬 Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Auto-Generate & Publish Ghibli Studio Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_GHIBLI_REFRESH_TOKEN: ${{ secrets.YT_GHIBLI_REFRESH_TOKEN }}
        run: |
          FORMAT="${{ inputs.format || 'shorts' }}"
          PRIVACY="${{ inputs.privacy || 'public' }}"
          THEME="${{ inputs.theme }}"
          DRY_RUN="${{ inputs.dry_run }}"

          DRY_RUN_FLAG=""
          UPLOAD_FLAG="--upload"
          if [ "$DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            UPLOAD_FLAG=""
          fi

          THEME_FLAG=""
          if [ -n "$THEME" ]; then
            THEME_FLAG="--theme \"$THEME\""
          fi

          python -m src.ghibli_pipeline --type "$FORMAT" --privacy "$PRIVACY" $UPLOAD_FLAG $DRY_RUN_FLAG $THEME_FLAG

      - name: 📦 Upload Generated Video & Thumbnail Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghibli-published-artifacts
          path: |
            output/ghibli/*_final.mp4
            output/ghibli/*_thumbnail.jpg
          retention-days: 14

      - name: 📊 Generate Summary Card
        if: always()
        run: |
          python -c '
          import os
          from pathlib import Path

          summary = ["## 🎨 Studio Ghibli Daily Video Report\n"]
          ghibli_dir = Path("output/ghibli")
          videos = list(ghibli_dir.glob("*_final.mp4")) if ghibli_dir.exists() else []
          if videos:
            last = sorted(videos, key=lambda f: f.stat().st_mtime)[-1]
            size_mb = last.stat().st_size / (1024 * 1024)
            summary.append(f"- **Rendered File:** `{last.name}` ({size_mb:.2f} MB)")
            summary.append(f"- **Format:** Vertical Shorts (9:16)" if "shorts" in last.name else "- **Format:** 16:9 Landscape Story")
          summary.append("\n*Download the rendered video from the **Artifacts** section below.*")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
            with open(summary_path, "a", encoding="utf-8") as f:
              f.write("\n".join(summary))
          '

      - name: 🧠 Persist Evolution Memory and Story Cache
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ 2>/dev/null || true
          git diff --staged --quiet || (git commit -m 'chore: update channel evolution memory [skip ci]' && git pull --rebase origin main && git push) || true
