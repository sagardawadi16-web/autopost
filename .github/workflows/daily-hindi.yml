name: Daily Hindi Video

on:
  schedule:
    - cron: '0 13 * * *'  # ~6:45 PM Nepal time
  workflow_dispatch:
    inputs:
      format:
        description: 'Video format (shorts or longform)'
        required: false
        default: 'shorts'
        type: choice
        options:
          - shorts
          - longform
      privacy:
        description: 'YouTube visibility'
        required: false
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private
      dry_run:
        description: 'Dry run (preview & download artifacts only, no upload)'
        required: false
        default: false
        type: boolean

jobs:
  generate-and-upload:
    name: 🎬 Produce Daily Hindi Short
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🎬 Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run AutoPost Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_HI_REFRESH_TOKEN: ${{ secrets.YT_HI_REFRESH_TOKEN }}
          CHANNEL: hindi
        run: |
          FORMAT="${{ inputs.format || 'shorts' }}"
          PRIVACY="${{ inputs.privacy || 'public' }}"
          DRY_RUN="${{ inputs.dry_run }}"

          DRY_RUN_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          python -m src.pipeline --channel hindi --format "$FORMAT" --privacy "$PRIVACY" $DRY_RUN_FLAG

      - name: 📦 Upload Generated Video & Thumbnail Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hindi-shorts-output
          path: |
            output/video/*.mp4
            output/thumbnails/*.jpg
          retention-days: 14

      - name: 📊 Generate Summary Card
        if: always()
        run: |
          python -c '
          import json, os
          from pathlib import Path

          log_file = Path("data/upload_log.json")
          summary = ["## 🎬 Hindi Daily Video Report\n"]
          if log_file.exists():
            try:
              data = json.loads(log_file.read_text(encoding="utf-8"))
              if data:
                last = data[-1]
                title = last.get("title", "N/A")
                privacy = last.get("privacy_status", "public")
                url = last.get("url", "")
                summary.append(f"- **Title:** {title}")
                summary.append(f"- **Privacy:** `{privacy}`")
                if last.get("dry_run"):
                  summary.append("- **Status:** 🧪 Simulation / Artifact preview")
                else:
                  summary.append(f"- **YouTube URL:** 🚀 [{url}]({url})")
            except Exception:
              pass
          summary.append("\n*Download the rendered video from the **Artifacts** section below.*")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
            with open(summary_path, "a", encoding="utf-8") as f:
              f.write("\n".join(summary))
          '

      - name: 🧠 Persist Evolution Memory and Story Cache
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ 2>/dev/null || true
          git diff --staged --quiet || (git commit -m 'chore: evolve channel strategy and update cache [skip ci]' && git push)
